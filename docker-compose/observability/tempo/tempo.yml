#################################
# Tempo single-binary example   #
#################################

server:
  # Make Tempo reachable from other containers
  http_listen_address: 0.0.0.0
  grpc_listen_address: 0.0.0.0
  http_listen_port: 3100       # Grafana / Tempo HTTP API
  grpc_listen_port: 4317       # Tempo GRPC API (query-frontend ↔ querier)

###########  Ingestion  #########
distributor:
  receivers:
    otlp:
      # Two OTLP endpoints → NO port collision
      protocols:
        grpc:
          endpoint: 0.0.0.0:4318   # <-- your apps send gRPC spans here
        http:
          endpoint: 0.0.0.0:55681  # <-- your apps send HTTP spans here

###########  Ingester  ##########
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

###########  Storage   ##########
storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal

###########  Compaction #########
compactor:
  compaction:
    block_retention: 1h

###########  Query path #########
query_frontend:
  search:
    duration_slo: 2s

#################################
# End of config                 #
#################################
