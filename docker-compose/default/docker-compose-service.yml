version: "3.8"
services:

  configserver:
    image: pisethbank/configserver:v2
    container_name: configserver-ms
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8071:8071"
    environment:
      SPRING_APPLICATION_NAME: "configserver"
      OTEL_SERVICE_NAME: "configserver"
    extends:
      file: common.yml
      service: ms-base

  eurekaserver:
    image: pisethbank/eurekaserver:v2
    container_name: eurekaserver-ms
    healthcheck:
      test: "curl --fail --silent localhost:9001/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "9001:9001"
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
      OTEL_SERVICE_NAME: "eurekaserver"
    extends:
      file: common.yml
      service: ms-base-configserver

  account:
    image: pisethbank/account:v2
    container_name: account-ms
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "account"
      OTEL_SERVICE_NAME: "account"
    extends:
      file: common.yml
      service: ms-base-eurekaserver

  card:
    image: pisethbank/card:v2
    container_name: card-ms
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8070:8070"
    environment:
      MONGODB_HOST_NAME: mongodb
      SPRING_APPLICATION_NAME: "card"
      OTEL_SERVICE_NAME: "card"
    extends:
      file: common.yml
      service: ms-base-eurekaserver

  loan:
    image: pisethbank/loan:v2
    container_name: loan-ms
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8090:8090"
    environment:
      MONGODB_HOST_NAME: mongodb
      SPRING_APPLICATION_NAME: "loan"
      OTEL_SERVICE_NAME: "loan"
    extends:
      file: common.yml
      service: ms-base-eurekaserver

  gatewayserver:
    image: pisethbank/gatewayserver:v2
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    depends_on: 
      account:
        condition: service_healthy
      card:
        condition: service_healthy
      loan:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gatewayserver"
      OTEL_SERVICE_NAME: "gatewayserver"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"  
    extends:
      file: common.yml
      service: ms-base-eurekaserver

  message:
    image: pisethbank/message:v2
    container_name: message-ms
    # depends_on:
    #   rabbit:
    #     condition: service_healthy
    environment:
      #SPRING_RABBITMQ_HOST: "rabbit"
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: "kafka:9092"
    extends:
      file: common.yml
      service: ms-deploy-network

networks:
  pisethbanknet:
